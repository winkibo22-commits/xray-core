# Builds the custom xray image and pushes it to GHCR on every push to main.
# No secrets needed: GITHUB_TOKEN already has packages:write for this repo.
# The Upsun config references ghcr.io/winkibo22-commits/xray-core:latest,
# so the GitHub repo MUST be public (Upsun only pulls public images).
name: Build and push xray-core image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - config.json
      - .github/workflows/docker-publish.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/winkibo22-commits/xray-core:latest
